# single-node Kafka in KRaft mode (broker + controller in one process, no ZooKeeper)
process.roles=broker,controller
node.id=1
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
controller.listener.names=CONTROLLER
controller.quorum.bootstrap.servers=localhost:9093
# topics are auto-created on first use
num.partitions=2
offsets.topic.replication.factor=1
# keep events forever: Teleport replays all UserAddressUpdated on every start
log.retention.ms=-1
log.dirs=target/kafka-logs
