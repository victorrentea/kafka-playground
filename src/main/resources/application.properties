server.port=0
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=victor.kafka
spring.kafka.consumer.auto-offset-reset=earliest
# Boot's default, simplified: local time to 0.1s, no dashes, class name without package, cut at 25 chars
logging.pattern.console=%clr(%d{HH:mm:ss.S}){faint} %clr(%5p) %clr(${PID}){magenta} %clr([%15.15t]){faint} %clr(%-25.-25logger{0}){cyan} %clr(:){faint} %m%n%wEx
